name: Build & Release iOS App

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'CibaEnglish/**'
      - 'project.yml'
      - '.github/workflows/ios-build-release.yml'
      - 'tools/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS App (Cloud Xcode)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen || true
          xcodegen generate

      - name: Build & Archive iOS App
        run: |
          mkdir -p build
          xcodebuild -project CibaEnglish.xcodeproj \
            -scheme CibaEnglish \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/CibaEnglish.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/CibaEnglish.xcarchive/Products/Applications/CibaEnglish.app Payload/
          zip -qr CibaEnglish-iOS.ipa Payload
          mkdir -p build-output
          cp CibaEnglish-iOS.ipa build-output/CibaEnglish-iOS-latest.ipa

          VERSION=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0.0")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VER="${{ github.ref_name }}"
            VERSION="${TAG_VER#v}"
          fi
          cp CibaEnglish-iOS.ipa "build-output/CibaEnglish-iOS-v${VERSION}.ipa"
          echo "PACKAGE_VERSION=v${VERSION}" >> $GITHUB_ENV
          echo "IOS_READY=true" >> $GITHUB_ENV

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CibaEnglish-iOS-IPA
          path: build-output/*.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        if: env.IOS_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_VERSION || github.ref_name }}
          name: 糍粑英语 ${{ env.PACKAGE_VERSION || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build-output/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
